# One command to run everything:  docker compose up --build --wait
# Web app: http://localhost:8080   API docs: http://localhost:8000/docs
# Full validation on Windows:      powershell -ExecutionPolicy Bypass -File scripts\validate_docker.ps1
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chakravyuh
      POSTGRES_PASSWORD: chakravyuh
      POSTGRES_DB: chakravyuh
    volumes: [pgdata:/var/lib/postgresql/data]
    # No host port: the API reaches PostgreSQL on the internal network as db:5432, so the stack
    # never clashes with another PostgreSQL on this machine. To connect from your machine (psql,
    # VS Code) add the override:  docker compose -f docker-compose.yml -f docker-compose.dbport.yml up -d
    healthcheck:
      # Check over TCP, not the local socket: on first start the image runs a temporary init server
      # that answers on the socket but refuses TCP, which would report healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U chakravyuh -d chakravyuh"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  api:
    build: ./backend
    image: chakravyuh-api:local
    environment:
      DATABASE_URL: postgresql+psycopg://chakravyuh:chakravyuh@db:5432/chakravyuh
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin}
      CHAKRAVYUH_LLM_BASE_URL: ${CHAKRAVYUH_LLM_BASE_URL:-}
      CHAKRAVYUH_LLM_API_KEY: ${CHAKRAVYUH_LLM_API_KEY:-}
      CHAKRAVYUH_LLM_MODEL: ${CHAKRAVYUH_LLM_MODEL:-}
      STORE_MESSAGE_TEXT: ${STORE_MESSAGE_TEXT:-true}
    depends_on:
      db: { condition: service_healthy }
    ports: ["${API_HOST_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8000/health', timeout=5).status != 200)"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 20s

  web:
    build: ./frontend
    image: chakravyuh-web:local
    depends_on:
      api: { condition: service_healthy }
    ports: ["${WEB_HOST_PORT:-8080}:80"]
    healthcheck:
      # goes through nginx's /health proxy, so a healthy web container proves the API proxy works
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
