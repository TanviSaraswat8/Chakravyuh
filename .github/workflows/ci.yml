name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  docker:
    # Full stack in Docker, the same checks as scripts/validate_docker.ps1: real images, PostgreSQL,
    # nginx proxy, smoke test, regression checks, privacy mode in the database, and the test suite.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build --progress plain
      - name: Start stack and wait until healthy
        run: docker compose up -d --wait --wait-timeout 300 && docker compose ps
      - name: Smoke test through nginx
        run: |
          docker compose cp scripts/smoke_test.py api:/tmp/smoke_test.py
          docker compose cp scripts/e2e_checks.py api:/tmp/e2e_checks.py
          docker compose exec -T api python /tmp/smoke_test.py http://web
      - name: Regression checks (Customs hold, flat deposit)
        run: docker compose exec -T api python /tmp/e2e_checks.py http://web
      - name: Privacy mode, checked in PostgreSQL
        run: |
          STORE_MESSAGE_TEXT=false docker compose up -d --wait api
          SINCE=$(docker compose exec -T db psql -U chakravyuh -tAc "select now()")
          docker compose cp scripts/e2e_checks.py api:/tmp/e2e_checks.py
          docker compose exec -T api python /tmp/e2e_checks.py http://localhost:8000 --privacy
          LEAKED=$(docker compose exec -T db psql -U chakravyuh -tAc "select count(*) from events where created_at >= '$SINCE' and type = 'MSG_RECV' and text is not null")
          echo "message texts stored in privacy mode: $LEAKED"; test "$LEAKED" -eq 0
      - name: Test suite inside the API image against PostgreSQL
        run: |
          docker compose exec -T db psql -U chakravyuh -c "CREATE DATABASE chakravyuh_test"
          docker compose exec -T -e TEST_DATABASE_URL=postgresql+psycopg://chakravyuh:chakravyuh@db:5432/chakravyuh_test api python -m pytest -q
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200

  validator:
    # Runs the real scripts/validate_docker.ps1 (PowerShell 7) on a machine set up like a typical dev
    # laptop: another project's PostgreSQL already publishes 5432 (as a pgvector container does) and
    # another program holds 8000. The stack must still come up healthy and every check must pass.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Occupy port 5432 with another PostgreSQL container, and port 8000 with another program
        run: |
          docker run -d --name other-project-postgres -p 5432:5432 -e POSTGRES_PASSWORD=x pgvector/pgvector:pg16
          nohup python3 -m http.server 8000 > /dev/null 2>&1 &
          sleep 3
          docker ps --format '{{.Names}} {{.Ports}}'
          curl -s -o /dev/null -w "port 8000 answered %{http_code}\n" http://localhost:8000/
      - name: Run the validator
        run: pwsh -NoProfile -File scripts/validate_docker.ps1 -NoPull
      - name: The other project's PostgreSQL was left untouched
        run: test "$(docker inspect -f '{{.State.Running}}' other-project-postgres)" = "true"
      - name: Report (failed checks and diagnosis are also posted as annotations on the run)
        if: always()
        run: |
          cat validation-report.txt || true
          python3 - <<'PY'
          import re
          try:
              text = open("validation-report.txt", encoding="utf-8-sig").read()
          except FileNotFoundError:
              print("::error title=validator::no validation-report.txt was written"); raise SystemExit
          lines = text.splitlines()
          for l in lines:
              if l.startswith("Result:"):
                  print(f"::notice title=validator result::{l}")
          table = [" ".join(l.split()) for l in lines if re.search(r"\s(PASS|FAIL|SKIP)\s", l)]
          print("::notice title=validator checks::" + " %0A".join(table)[:8000])
          for l in lines:
              if re.search(r"\sFAIL\s", l):
                  print(f"::error title=FAIL::{' '.join(l.split())[:900]}")
          if "Container diagnosis:" in text:
              diag = text.split("Container diagnosis:", 1)[1].split("Images:", 1)[0].strip()
              print(f"::warning title=diagnosis::{' | '.join(x.strip() for x in diag.splitlines() if x.strip())[:3000]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            validation-report.txt
            validation-build.log
