# Render blueprint: New > Blueprint > pick this repo. Creates the database, API and web app.
databases:
  - name: chakravyuh-db
    plan: free
    databaseName: chakravyuh
    user: chakravyuh

services:
  - type: web
    name: chakravyuh-api
    runtime: docker
    rootDir: backend
    plan: starter            # the models need ~1 GB RAM; the free plan's 512 MB is too small
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: chakravyuh-db, property: connectionString }
      - key: ADMIN_API_KEY
        generateValue: true
      - key: STORE_MESSAGE_TEXT
        value: "false"
      - key: CORS_ORIGINS
        value: https://chakravyuh-web.onrender.com
      - key: CHAKRAVYUH_ENV
        value: production

  - type: web
    name: chakravyuh-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://chakravyuh-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
