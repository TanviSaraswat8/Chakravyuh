# Render blueprint: New > Blueprint > pick this repo. Creates the database, API and web app.
databases:
  - name: chakravyuh-db
    plan: free
    databaseName: chakravyuh
    user: chakravyuh

services:
  - type: web
    name: chakravyuh-api
    runtime: docker
    rootDir: backend
    plan: starter            # the models need ~1 GB RAM; the free plan's 512 MB is too small
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: chakravyuh-db, property: connectionString }
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false                      # set in the dashboard; password below is generated
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none                      # web and API are separate onrender.com sites
      - key: TRUST_FORWARDED_FOR
        value: "true"
      - key: STORE_MESSAGE_TEXT
        value: "false"
      - key: CORS_ORIGINS
        value: https://chakravyuh-web.onrender.com
      - key: CHAKRAVYUH_ENV
        value: production

  - type: web
    name: chakravyuh-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://chakravyuh-api.onrender.com
    headers:
      - { path: /*, name: Content-Security-Policy, value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://chakravyuh-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" }
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: X-Frame-Options, value: DENY }
      - { path: /*, name: Referrer-Policy, value: strict-origin-when-cross-origin }
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
