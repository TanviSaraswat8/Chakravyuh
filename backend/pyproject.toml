[project]
name = "chakravyuh"
version = "0.1.0"
description = "Scam-session detection for UPI, banking and wallets"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]   # FastAPI Depends() defaults; zip() lengths are equal by construction

[tool.ruff.lint.per-file-ignores]
"chakravyuh/sim/library.py" = ["E501"]
"app/services/alert_text.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # tests import `app` and `chakravyuh` whether run as `pytest` or `python -m pytest`
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
