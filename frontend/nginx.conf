server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API requests go to the backend container (used by docker compose).
  location /v1/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_read_timeout 300s; }
  location /health { proxy_pass http://api:8000; }

  # Single-page app: unknown paths serve index.html.
  location / { try_files $uri /index.html; }
}
