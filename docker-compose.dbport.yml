# Optional: publish PostgreSQL on your machine for psql / VS Code. Not needed to run Chakravyuh.
#   docker compose -f docker-compose.yml -f docker-compose.dbport.yml up -d
# Uses 127.0.0.1:55432 by default so it does not clash with another PostgreSQL on 5432.
services:
  db:
    ports: ["127.0.0.1:${DB_HOST_PORT:-55432}:5432"]
